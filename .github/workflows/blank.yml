
name: CI/CD Pipeline for Bluelie App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Testing (Python / Pytest / Ruff)
  # -------------------------------------------------------------
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Bluelie/app/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          pytest tests/

  # -------------------------------------------------------------
  # Job 2: Frontend Build & Verification (Expo / Node.js)
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Bluelie/app/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-python@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Type Check (TypeScript)
        run: yarn tsc --noEmit

      - name: Expo Web Build Verification
        run: npx expo export --platform web
