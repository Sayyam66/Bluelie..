name: Build Bluelie Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect frontend directory
        shell: bash
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "APP_DIR=frontend" >> "$GITHUB_ENV"
          elif [ -f "app/frontend/package.json" ]; then
            echo "APP_DIR=app/frontend" >> "$GITHUB_ENV"
          elif [ -f "package.json" ] && [ -f "app.json" ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: Could not find the Expo frontend package.json"
            find . -maxdepth 4 -name package.json -print
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          yarn install --no-immutable

      - name: Verify Expo project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          test -f package.json
          test -f app.json
          node -e "const p=require('./package.json'); console.log('Expo version:', p.dependencies.expo)"
          node -e "const a=require('./app.json'); console.log('Android package:', a.expo.android.package)"

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Initialize EAS project if needed
        working-directory: ${{ env.APP_DIR }}
        run: eas project:init --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create APK build profile
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          cat > eas.json <<'EOF'
          {
            "build": {
              "preview": {
                "distribution": "internal",
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }
          EOF

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
