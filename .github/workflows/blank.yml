name: Build Bluelie Android AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/frontend

    steps:
      # 1. GitHub repository checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify correct project location
      - name: Verify Expo project
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found in app/frontend"
            exit 1
          fi

          if [ ! -f app.json ] && [ ! -f app.config.js ] && [ ! -f app.config.ts ]; then
            echo "ERROR: Expo configuration not found"
            exit 1
          fi

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Enable Yarn
      - name: Enable Corepack
        run: corepack enable

      # 5. Install dependencies
      - name: Install dependencies
        run: yarn install

      # 6. Install EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 7. Check Expo configuration
      - name: Check Expo configuration
        run: npx expo config --type public

      # 8. Check Android package name
      - name: Verify Android package name
        shell: bash
        run: |
          PACKAGE=$(node -e "
            const fs=require('fs');
            const a=JSON.parse(fs.readFileSync('app.json','utf8'));
            console.log(a.expo?.android?.package || '');
          ")

          echo "Android package: $PACKAGE"

          if [ "$PACKAGE" != "com.sayyamchordiya.bluelie" ]; then
            echo "ERROR: Android package must be:"
            echo "com.sayyamchordiya.bluelie"
            exit 1
          fi

      # 9. Create production EAS configuration
      - name: Create eas.json
        shell: bash
        run: |
          cat > eas.json <<'EOF'
          {
            "build": {
              "production": {
                "distribution": "store",
                "android": {
                  "buildType": "app-bundle"
                }
              }
            }
          }
          EOF

          cat eas.json

      # 10. Build Google Play AAB
      - name: Build Android AAB
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }
          
